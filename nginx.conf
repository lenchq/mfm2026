server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite assets contain content hashes and can be cached indefinitely.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Never return the SPA HTML for a missing image or video.
    # Nginx serves byte-range requests for seeking in MP4 files by default.
    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location /videos/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Support direct links and refreshes on client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
